<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">GO ELO Android 黑金界面预览</title>
  <desc id="desc">成长、记一盘和棋手管理三个页面的黑金风格预览图。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d120f"/>
      <stop offset="0.55" stop-color="#18231b"/>
      <stop offset="1" stop-color="#0b0f0d"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
